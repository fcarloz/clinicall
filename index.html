<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CliniCall</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #0b5cff;
    color: white;
    padding: 22px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 5px 0 0;
    opacity: .85;
    font-size: 14px;
}

main {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

textarea,
select {
    width: 100%;
    border: 1px solid #d9deea;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 15px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 10px;
}

.primary {
    background: #0b5cff;
    color: white;
}

.secondary {
    background: #edf2ff;
    color: #0b5cff;
}

.danger {
    background: #fff0f0;
    color: #d62828;
}

.patient {
    text-align: center;
    padding: 15px 5px 20px;
}

.number {
    font-size: 17px;
    color: #697386;
}

.name {
    font-size: 30px;
    font-weight: 700;
    margin: 7px 0;
}

.destination {
    font-size: 18px;
    color: #0b5cff;
    font-weight: 600;
}

.status {
    margin-top: 10px;
    color: #697386;
    font-size: 14px;
}

.counter {
    text-align: center;
    font-size: 14px;
    color: #697386;
    margin-top: 12px;
}

.destinationBox {
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>CliniCall</h1>
    <p>Patient Calling System</p>
</header>

<main>

<div class="card">

    <label for="patientList">
        Lista de pacientes
    </label>

    <textarea id="patientList"
    placeholder="Escribe un paciente por línea:

Juan Pérez
María López
Carlos García"></textarea>

    <button class="primary" onclick="loadPatients()">
        📋 Cargar pacientes
    </button>

</div>


<div class="card">

    <div class="patient">

        <div class="number" id="number">
            Paciente
        </div>

        <div class="name" id="name">
            —
        </div>

        <div class="destination" id="destination">
            —
        </div>

        <div class="status" id="status">
            Esperando lista de pacientes
        </div>

    </div>


    <div class="destinationBox">

        <label for="destinationSelect">
            Destino
        </label>

        <select id="destinationSelect"
                onchange="changeDestination()">

            <option value="signos vitales">
                Signos vitales
            </option>

            <option value="Clínica 1">
                Clínica 1
            </option>

            <option value="Clínica 2">
                Clínica 2
            </option>

            <option value="Clínica 3">
                Clínica 3
            </option>

            <option value="Clínica 4">
                Clínica 4
            </option>

            <option value="esperar frente a Clínica 1">
                Esperar frente a Clínica 1
            </option>

            <option value="esperar frente a Clínica 2">
                Esperar frente a Clínica 2
            </option>

            <option value="esperar frente a Clínica 3">
                Esperar frente a Clínica 3
            </option>

            <option value="esperar frente a Clínica 4">
                Esperar frente a Clínica 4
            </option>

        </select>

    </div>


    <button class="primary" onclick="callPatient()">
        🔊 Llamar
    </button>


    <button class="secondary" onclick="nextPatient()">
        ⏭️ Siguiente
    </button>


    <button class="secondary" onclick="repeatPatient()">
        🔁 Repetir
    </button>


    <button class="danger" onclick="stopCalling()">
        ⏹️ Detener voz
    </button>


    <div class="counter" id="counter">
        0 pacientes cargados
    </div>

</div>

</main>


<script>

let patients = [];
let currentIndex = -1;


/* CARGAR PACIENTES */

function loadPatients() {

    const text =
        document.getElementById("patientList").value;

    patients = text
        .split("\n")
        .map(name => name.trim())
        .filter(name => name.length > 0);

    currentIndex =
        patients.length > 0 ? 0 : -1;

    updateScreen();

    if (patients.length > 0) {

        document.getElementById("status").textContent =
            "Lista cargada. Seleccione el destino.";

    }

}


/* ACTUALIZAR PANTALLA */

function updateScreen() {

    const name =
        document.getElementById("name");

    const number =
        document.getElementById("number");

    const destination =
        document.getElementById("destination");

    const counter =
        document.getElementById("counter");


    if (currentIndex === -1 ||
        patients.length === 0) {

        name.textContent = "—";
        number.textContent = "Paciente";
        destination.textContent = "—";
        counter.textContent =
            "0 pacientes cargados";

        return;
    }


    number.textContent =
        "Paciente " + (currentIndex + 1);

    name.textContent =
        patients[currentIndex];


    const selected =
        document.getElementById("destinationSelect")
        .value;

    destination.textContent =
        selected;


    counter.textContent =
        (currentIndex + 1) +
        " de " +
        patients.length;

}


/* CAMBIAR DESTINO */

function changeDestination() {

    if (patients.length === 0) {
        return;
    }

    const selected =
        document.getElementById("destinationSelect")
        .value;

    document.getElementById("destination")
        .textContent = selected;

}


/* LLAMAR */

function callPatient() {

    if (patients.length === 0) {

        alert(
            "Primero debes cargar una lista de pacientes."
        );

        return;
    }


    speakPatient();

}


/* VOZ */

function speakPatient() {

    window.speechSynthesis.cancel();


    const patient =
        patients[currentIndex];


    const destination =
        document.getElementById("destinationSelect")
        .value;


    let text;


    if (destination === "signos vitales") {

        text =
            "Paciente " +
            patient +
            ", por favor pasar a signos vitales.";

    }

    else if (
        destination.startsWith("esperar frente")
    ) {

        text =
            "Paciente " +
            patient +
            ", por favor " +
            destination +
            ".";

    }

    else {

        text =
            "Paciente " +
            patient +
            ", por favor pasar a " +
            destination +
            ".";

    }


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang = "es-GT";
    speech.rate = 0.85;
    speech.pitch = 1;
    speech.volume = 1;


    document.getElementById("status")
        .textContent = "🔊 Llamando...";


    speech.onend = function() {

        document.getElementById("status")
            .textContent =
            "Llamado realizado";

    };


    window.speechSynthesis.speak(speech);

}


/* SIGUIENTE */

function nextPatient() {

    if (patients.length === 0) {

        alert(
            "Primero debes cargar una lista."
        );

        return;
    }


    if (currentIndex <
        patients.length - 1) {

        currentIndex++;

        updateScreen();


        document.getElementById("status")
            .textContent =
            "Listo para llamar.";

    }

    else {

        document.getElementById("status")
            .textContent =
            "✅ No hay más pacientes.";

    }

}


/* REPETIR */

function repeatPatient() {

    if (
        patients.length === 0 ||
        currentIndex === -1
    ) {
        return;
    }

    speakPatient();

}


/* DETENER */

function stopCalling() {

    window.speechSynthesis.cancel();

    document.getElementById("status")
        .textContent =
        "Voz detenida.";

}

</script>

</body>
</html>
