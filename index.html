<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CliniCall</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #0b5cff;
    color: white;
    padding: 22px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 5px 0 0;
    opacity: .85;
    font-size: 14px;
}

main {
    max-width: 650px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

h2 {
    font-size: 18px;
    margin: 0 0 15px;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

textarea,
select {
    width: 100%;
    border: 1px solid #d9deea;
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 125px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 15px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 9px;
}

.primary {
    background: #0b5cff;
    color: white;
}

.secondary {
    background: #edf2ff;
    color: #0b5cff;
}

.group {
    background: #111827;
    color: white;
}

.danger {
    background: #fff0f0;
    color: #d62828;
}

.patient {
    text-align: center;
    padding: 10px 5px 15px;
}

.number {
    font-size: 16px;
    color: #697386;
}

.name {
    font-size: 30px;
    font-weight: 700;
    margin: 7px 0;
}

.destination {
    font-size: 18px;
    color: #0b5cff;
    font-weight: 600;
}

.status {
    margin-top: 9px;
    color: #697386;
    font-size: 14px;
}

.modeButtons {
    display: flex;
    gap: 8px;
}

.modeButtons button {
    margin-top: 0;
    padding: 12px 8px;
    font-size: 14px;
}

.modeActive {
    background: #0b5cff !important;
    color: white !important;
}

.settingsRow {
    margin-top: 15px;
}

input[type="range"] {
    width: 100%;
}

.voiceName {
    margin-top: 6px;
    font-size: 12px;
    color: #697386;
}

.counter {
    text-align: center;
    font-size: 14px;
    color: #697386;
    margin-top: 12px;
}

.groupResult {
    background: #f5f7fb;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
    font-size: 15px;
}

.groupResult strong {
    color: #0b5cff;
}
</style>
</head>

<body>

<header>
    <h1>CliniCall</h1>
    <p>Patient Calling System</p>
</header>

<main>

<!-- LISTA -->

<div class="card">

    <h2>📋 Pacientes</h2>

    <textarea id="patientList"
    placeholder="Un paciente por línea:

Juan Pérez
María López
Carlos García
Ana López"></textarea>

    <button class="primary" onclick="loadPatients()">
        Cargar pacientes
    </button>

</div>


<!-- CONFIGURACIÓN -->

<div class="card">

    <h2>⚙️ Configuración</h2>

    <label>Modo de llamado</label>

    <div class="modeButtons">

        <button
            id="individualMode"
            class="modeActive"
            onclick="setMode('individual')">
            👤 Individual
        </button>

        <button
            id="groupMode"
            onclick="setMode('group')">
            👥 Por destino
        </button>

        <button
            id="allMode"
            onclick="setMode('all')">
            📋 Todos
        </button>

    </div>


    <div class="settingsRow">

        <label for="voiceSelect">
            🗣️ Voz
        </label>

        <select id="voiceSelect"></select>

        <div class="voiceName" id="voiceInfo">
            Voces disponibles en este dispositivo
        </div>

    </div>


    <div class="settingsRow">

        <label for="rate">
            🎚️ Velocidad
        </label>

        <input
            type="range"
            id="rate"
            min="0.5"
            max="1.2"
            step="0.05"
            value="0.85">

    </div>

</div>


<!-- PACIENTE ACTUAL -->

<div class="card">

    <h2>Paciente actual</h2>

    <div class="patient">

        <div class="number" id="number">
            Paciente
        </div>

        <div class="name" id="name">
            —
        </div>

        <div class="destination" id="destination">
            —
        </div>

        <div class="status" id="status">
            Esperando lista de pacientes
        </div>

    </div>


    <label for="destinationSelect">
        🏥 Destino
    </label>

    <select id="destinationSelect"
            onchange="changeDestination()">

        <option value="signos vitales">
            Signos vitales
        </option>

        <option value="Clínica 1">
            Clínica 1
        </option>

        <option value="Clínica 2">
            Clínica 2
        </option>

        <option value="Clínica 3">
            Clínica 3
        </option>

        <option value="Clínica 4">
            Clínica 4
        </option>

        <option value="esperar frente a Clínica 1">
            Esperar frente a Clínica 1
        </option>

        <option value="esperar frente a Clínica 2">
            Esperar frente a Clínica 2
        </option>

        <option value="esperar frente a Clínica 3">
            Esperar frente a Clínica 3
        </option>

        <option value="esperar frente a Clínica 4">
            Esperar frente a Clínica 4
        </option>

    </select>


    <button class="primary" onclick="callPatient()">
        🔊 Llamar
    </button>


    <button class="secondary" onclick="nextPatient()">
        ⏭️ Siguiente
    </button>


    <button class="secondary" onclick="repeatPatient()">
        🔁 Repetir
    </button>


    <button class="danger" onclick="stopCalling()">
        ⏹️ Detener voz
    </button>


    <div class="counter" id="counter">
        0 pacientes cargados
    </div>

</div>


<!-- LLAMADO POR GRUPO -->

<div class="card">

    <h2>👥 Llamado por destino</h2>

    <label for="groupDestination">
        Seleccionar destino
    </label>

    <select id="groupDestination"
            onchange="showGroup()">

        <option value="signos vitales">
            Signos vitales
        </option>

        <option value="Clínica 1">
            Clínica 1
        </option>

        <option value="Clínica 2">
            Clínica 2
        </option>

        <option value="Clínica 3">
            Clínica 3
        </option>

        <option value="Clínica 4">
            Clínica 4
        </option>

        <option value="esperar frente a Clínica 1">
            Esperar frente a Clínica 1
        </option>

        <option value="esperar frente a Clínica 2">
            Esperar frente a Clínica 2
        </option>

        <option value="esperar frente a Clínica 3">
            Esperar frente a Clínica 3
        </option>

        <option value="esperar frente a Clínica 4">
            Esperar frente a Clínica 4
        </option>

    </select>


    <div
        class="groupResult"
        id="groupResult">

        Carga pacientes para ver el grupo.

    </div>


    <button class="group"
            onclick="callGroup()">

        📢 Llamar grupo

    </button>

</div>

</main>


<script>

let patients = [];
let currentIndex = -1;
let mode = "individual";
let voices = [];


/* =========================
   VOCES
========================= */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();

    const select =
        document.getElementById("voiceSelect");

    select.innerHTML = "";

    const spanishVoices =
        voices.filter(v =>
            v.lang.toLowerCase().startsWith("es")
        );

    const available =
        spanishVoices.length > 0
        ? spanishVoices
        : voices;


    available.forEach((voice, index) => {

        const option =
            document.createElement("option");

        option.value =
            voices.indexOf(voice);

        option.textContent =
            voice.name +
            " — " +
            voice.lang;

        select.appendChild(option);

    });


    if (available.length === 0) {

        const option =
            document.createElement("option");

        option.textContent =
            "Voz predeterminada del dispositivo";

        select.appendChild(option);

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();


/* =========================
   MODO
========================= */

function setMode(newMode) {

    mode = newMode;


    document
        .getElementById("individualMode")
        .classList.remove("modeActive");

    document
        .getElementById("groupMode")
        .classList.remove("modeActive");

    document
        .getElementById("allMode")
        .classList.remove("modeActive");


    if (mode === "individual") {

        document
            .getElementById("individualMode")
            .classList.add("modeActive");

    }

    if (mode === "group") {

        document
            .getElementById("groupMode")
            .classList.add("modeActive");

    }

    if (mode === "all") {

        document
            .getElementById("allMode")
            .classList.add("modeActive");

    }

}


/* =========================
   CARGAR PACIENTES
========================= */

function loadPatients() {

    const text =
        document
        .getElementById("patientList")
        .value;


    patients = text
        .split("\n")
        .map(name => name.trim())
        .filter(name => name.length > 0)
        .map(name => ({
            name: name,
            destination:
                document
                .getElementById("destinationSelect")
                .value
        }));


    currentIndex =
        patients.length > 0
        ? 0
        : -1;


    updateScreen();
    showGroup();


    if (patients.length > 0) {

        document
            .getElementById("status")
            .textContent =
            "Lista cargada.";

    }

}


/* =========================
   PANTALLA
========================= */

function updateScreen() {

    const name =
        document.getElementById("name");

    const number =
        document.getElementById("number");

    const destination =
        document.getElementById("destination");

    const counter =
        document.getElementById("counter");


    if (
        currentIndex === -1 ||
        patients.length === 0
    ) {

        name.textContent = "—";
        number.textContent = "Paciente";
        destination.textContent = "—";
        counter.textContent =
            "0 pacientes cargados";

        return;

    }


    number.textContent =
        "Paciente " +
        (currentIndex + 1);


    name.textContent =
        patients[currentIndex].name;


    document
        .getElementById("destinationSelect")
        .value =
        patients[currentIndex].destination;


    destination.textContent =
        patients[currentIndex].destination;


    counter.textContent =
        (currentIndex + 1) +
        " de " +
        patients.length;

}


/* =========================
   CAMBIAR DESTINO
========================= */

function changeDestination() {

    if (
        patients.length === 0 ||
        currentIndex === -1
    ) {
        return;
    }


    const destination =
        document
        .getElementById("destinationSelect")
        .value;


    patients[currentIndex].destination =
        destination;


    document
        .getElementById("destination")
        .textContent =
        destination;


    showGroup();

}


/* =========================
   CREAR FRASE
========================= */

function createSentence(patient) {

    const destination =
        patient.destination;


    if (
        destination ===
        "signos vitales"
    ) {

        return (
            "Paciente " +
            patient.name +
            ", por favor pasar a signos vitales."
        );

    }


    if (
        destination.startsWith(
            "esperar frente"
        )
    ) {

        return (
            "Paciente " +
            patient.name +
            ", por favor " +
            destination +
            "."
        );

    }


    return (
        "Paciente " +
        patient.name +
        ", por favor pasar a " +
        destination +
        "."
    );

}


/* =========================
   HABLAR
========================= */

function speak(text, finishedCallback) {

    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    const voiceIndex =
        parseInt(
            document
            .getElementById("voiceSelect")
            .value
        );


    if (
        !isNaN(voiceIndex) &&
        voices[voiceIndex]
    ) {

        speech.voice =
            voices[voiceIndex];

    }


    speech.lang = "es-GT";


    speech.rate =
        parseFloat(
            document
            .getElementById("rate")
            .value
        );


    speech.pitch = 1;
    speech.volume = 1;


    speech.onend = function() {

        if (finishedCallback) {
            finishedCallback();
        }

    };


    window.speechSynthesis.speak(speech);

}


/* =========================
   LLAMAR INDIVIDUAL
========================= */

function callPatient() {

    if (patients.length === 0) {

        alert(
            "Primero debes cargar pacientes."
        );

        return;

    }


    const text =
        createSentence(
            patients[currentIndex]
        );


    document
        .getElementById("status")
        .textContent =
        "🔊 Llamando...";


    speak(
        text,
        function() {

            document
                .getElementById("status")
                .textContent =
                "Llamado realizado.";

        }
    );

}


/* =========================
   SIGUIENTE
========================= */

function nextPatient() {

    if (patients.length === 0) {

        alert(
            "Primero debes cargar pacientes."
        );

        return;

    }


    if (
        currentIndex <
        patients.length - 1
    ) {

        currentIndex++;

        updateScreen();

        document
            .getElementById("status")
            .textContent =
            "Listo para llamar.";

    }

    else {

        document
            .getElementById("status")
            .textContent =
            "✅ No hay más pacientes.";

    }

}


/* =========================
   REPETIR
========================= */

function repeatPatient() {

    if (
        patients.length === 0 ||
        currentIndex === -1
    ) {
        return;
    }


    callPatient();

}


/* =========================
   DETENER
========================= */

function stopCalling() {

    window.speechSynthesis.cancel();


    document
        .getElementById("status")
        .textContent =
        "Voz detenida.";

}


/* =========================
   MOSTRAR GRUPO
========================= */

function showGroup() {

    const destination =
        document
        .getElementById("groupDestination")
        .value;


    const group =
        patients.filter(
            patient =>
            patient.destination ===
            destination
        );


    const result =
        document
        .getElementById("groupResult");


    if (group.length === 0) {

        result.innerHTML =
            "No hay pacientes asignados a este destino.";

        return;

    }


    let html =
        "<strong>" +
        group.length +
        " paciente(s)</strong><br><br>";


    group.forEach(
        (patient, index) => {

            html +=
                (index + 1) +
                ". " +
                patient.name +
                "<br>";

        }
    );


    result.innerHTML = html;

}


/* =========================
   LLAMAR GRUPO
========================= */

function callGroup() {

    if (patients.length === 0) {

        alert(
            "Primero debes cargar pacientes."
        );

        return;

    }


    const destination =
        document
        .getElementById("groupDestination")
        .value;


    const group =
        patients.filter(
            patient =>
            patient.destination ===
            destination
        );


    if (group.length === 0) {

        alert(
            "No hay pacientes para este destino."
        );

        return;

    }


    let names;


    if (group.length === 1) {

        names =
            group[0].name;

    }

    else if (group.length === 2) {

        names =
            group[0].name +
            " y " +
            group[1].name;

    }

    else {

        const firstNames =
            group
            .slice(0, -1)
            .map(p => p.name)
            .join(", ");

        const lastName =
            group[group.length - 1].name;

        names =
            firstNames +
            " y " +
            lastName;

    }


    let sentence;


    if (
        destination ===
        "signos vitales"
    ) {

        sentence =
            "Atención. " +
            names +
            ", por favor pasar a signos vitales.";

    }

    else if (
        destination.startsWith(
            "esperar frente"
        )
    ) {

        sentence =
            "Atención. " +
            names +
            ", por favor " +
            destination +
            ".";

    }

    else {

        sentence =
            "Atención. " +
            names +
            ", por favor pasar a " +
            destination +
            ".";

    }


    document
        .getElementById("status")
        .textContent =
        "📢 Llamando grupo...";


    speak(
        sentence,
        function() {

            document
                .getElementById("status")
                .textContent =
                "Llamado de grupo realizado.";

        }
    );

}

</script>

</body>
</html>
